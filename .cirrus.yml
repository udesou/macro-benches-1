# Cirrus CI: the same build-and-run-once gate as .github/workflows/ci.yml, on
# FreeBSD.
#
# Why here and not in GitHub Actions: GitHub has no FreeBSD runners, and the
# only free route there is a QEMU VM inside a Linux runner, which is several
# times slower than native. The Linux gate takes about 35 minutes; emulated it
# would be at risk of the 6 hour job cap for no reason. Cirrus runs FreeBSD
# natively.
#
# Why run the WHOLE suite rather than a portability smoke test: the FreeBSD
# port turned up two distinct classes of breakage. GNU-only shell constructs
# (`make --quiet`, `sed '1a text'`, `/bin/true`), which the two test scripts
# below catch in under a second, AND vendored-source problems that only appear
# when you actually compile: extunix's gettid probe, owl's OpenMP link flags,
# gsl-ocaml's hardcoded include path, goblint's domainslib select, and CIL's
# real-GCC search. Nothing short of a real build finds that second class, and
# it was the larger half.
#
# Kept deliberately close to the GitHub workflow, step for step, so the two do
# not drift. Where they differ it is because the platform forces it, and the
# comment says so.
#
# TO CHECK BEFORE RELYING ON THIS:
#   - Cirrus's free-tier limits for public repositories, which have changed
#     more than once. The first push reports quota problems immediately.
#   - image_family below. Pick the newest FreeBSD family Cirrus publishes; the
#     port was validated on 15.1, so prefer a 15.x family if one exists.

env:
  # Picks the build dir (_build-ci) and the output binary suffix, exactly as the
  # GitHub workflow does.
  RUNNING_OCAML_RUNTIME_NAME: ci
  # OPAMROOT is explicit so the cache below has a fixed path to key on, rather
  # than depending on where Cirrus puts HOME. OPAMYES keeps opam from waiting on
  # a prompt in a non-interactive task.
  OPAMYES: "1"
  OPAMROOT: /tmp/opamroot

# Pull requests and master only, matching the GitHub workflow: work in progress
# on other branches should not burn compute.
only_if: $CIRRUS_BRANCH == 'master' || $CIRRUS_PR != ''

task:
  name: "freebsd build + run once ($LABEL)"
  timeout_in: 120m

  freebsd_instance:
    image_family: freebsd-14-2
    cpu: 8
    memory: 16G

  matrix:
    - env:
        LABEL: stable
        OCAML_PKG: "5.5.0"
        # Released dune >= 3.24 breaks the vendored rocq build.
        DUNE: "3.22.1"
    - env:
        LABEL: trunk
        OCAML_PKG: "ocaml-variants.5.6.0+trunk"
        # Released dune cannot bootstrap against 5.6 trunk; use git main.
        DUNE: "dev"
      # Informational, like its GitHub twin. It tracks a moving compiler and
      # depends on ppxlib git main, so it goes red for reasons that have nothing
      # to do with a change here: as of 2026-09-17, trunk added a Pexp_hole
      # constructor that the pinned ppxlib does not know, which fails 41 of 95
      # programs on Linux too. It reports; it does not gate.
      allow_failures: true

  # System dependencies. The FreeBSD list is shorter than the apt one in the
  # GitHub workflow and README explains why: zlib and the C toolchain are in the
  # base system, and there is no PCRE2 anywhere in the tree.
  #
  # gmake is NOT optional here. camlidl's and camlzip's Makefiles use GNU
  # conditionals that bmake rejects as a syntax error, so vendor-apron.sh and
  # vendor-javalib-sawja.sh resolve `make` through the gnu_make helper.
  # No ocaml package: the switch below provides the compiler, and a system
  # ocaml on PATH would shadow it in anything that runs before `opam env`.
  install_deps_script: |
    pkg install -y \
      bash git gmake autoconf automake libtool m4 pkgconf zip \
      gmp mpfr openblas lapacke gsl sqlite3 libyaml perl5 \
      curl libev libevent pcre \
      opam python3

  # First and cheapest. Both suites take under a second and need nothing but
  # bash, so a GNU-ism fails here rather than forty minutes into a build.
  #
  # They also matter on their own: on Linux these run the FreeBSD code paths
  # through a fake `uname`, reporting 24 checks. Here they run for real and
  # report 14, because the GNU comparisons are skipped. Nothing else confirms
  # that the simulation is honest.
  portability_tests_script: |
    bash scripts/tests/test-lib-portable.sh
    bash scripts/tests/test-build-scripts-portable.sh
    for f in scripts/*.sh benchmarks/*/*.build.sh; do bash -n "$f"; done

  # The GitHub workflow uses ocaml/setup-ocaml@v3, which does not exist here, so
  # the switch is created by hand. --disable-sandboxing because opam's sandbox
  # is bwrap-based and Linux-only.
  opam_cache:
    folder: /tmp/opamroot
    fingerprint_script: echo "opam-$LABEL-$OCAML_PKG-$DUNE"
  setup_opam_script: |
    opam init --bare --disable-sandboxing --no-setup
    opam switch list --short | grep -qx ci || opam switch create ci "$OCAML_PKG"
    eval "$(opam env --switch=ci --set-switch)"
    if [ "$DUNE" = "dev" ]; then
      opam pin add --yes dune --dev-repo
    else
      opam pin add --yes --no-action dune "$DUNE"
      opam install --yes "dune.$DUNE"
    fi
    dune --version

  # Cheap and early, as on Linux: fails in seconds on a benchmark added without
  # a manifest entry rather than deep into a build.
  manifest_script: python3 scripts/ci-manifest.py check

  # duniverse/, vendor/ and _rocq_prefix/ are the output of the setup phase, and
  # only change when the lock file, sources.yml or the scripts do. vendor/ also
  # holds the per-runtime apron prefix, so the compiler identity is part of the
  # key. Same set and same reasoning as the GitHub cache.
  vendor_cache:
    folder:
      - duniverse
      - vendor
      - _rocq_prefix
    fingerprint_script: |
      echo "vendor-$LABEL-$OCAML_PKG"
      md5 -q macro-benches.opam.locked sources.yml dune-project \
             scripts/setup-monorepo.sh scripts/lib-sources.sh
      md5 -q scripts/vendor-*.sh

  setup_script: |
    eval "$(opam env --switch=ci --set-switch)"
    # As on Linux: the switch just created is both the tools switch and the
    # runtime under test, and SKIP_TEST_BUILD avoids compiling the duniverse a
    # second time into the default _build/.
    TOOLS_SWITCH="$(opam switch show)" SKIP_TEST_BUILD=1 \
      bash scripts/setup-monorepo.sh

  build_script: |
    eval "$(opam env --switch=ci --set-switch)"
    bash scripts/ci-build-all.sh

  run_script: |
    eval "$(opam env --switch=ci --set-switch)"
    bash scripts/ci-run-all.sh

  always:
    disk_usage_script: |
      df -h /
      du -sh duniverse vendor _rocq_prefix _build-ci 2>/dev/null || true
    ci_logs_artifacts:
      path: "ci-logs/**"
